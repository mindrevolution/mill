name: Sync Plugin

on:
  release:
    types: [published]
  workflow_dispatch:  # Manual trigger for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare plugin distribution
        run: |
          mkdir -p plugin-dist/.claude-plugin
          mkdir -p plugin-dist/skills
          mkdir -p plugin-dist/templates

          # Copy plugin manifest and marketplace
          cp .claude-plugin/plugin.json plugin-dist/.claude-plugin/
          cp .claude-plugin/marketplace.json plugin-dist/.claude-plugin/

          # Copy skills
          cp -r skills/* plugin-dist/skills/

          # Copy templates
          cp -r templates/* plugin-dist/templates/

          # Create README
          cat > plugin-dist/README.md << 'EOF'
          # mindrevolution — Claude Code Plugins

          A plugin marketplace for Claude Code by [mindrevolution](https://github.com/mindrevolution).

          ## Setup

          ```
          /plugin marketplace add mindrevolution/claude-plugins
          ```

          ## Available Plugins

          ### mill

          Think it through. Ship it right. Sharper every cycle.

          ```
          /plugin install mill@mindrevolution
          ```

          Learn more: [mill on GitHub](https://github.com/mindrevolution/mill) · [Documentation](https://mill.mindrevolution.com)
          EOF

      - name: Push to claude-plugins
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.MILL_PLUGIN_DEPLOY_KEY }}
        with:
          source-directory: 'plugin-dist'
          destination-github-username: 'mindrevolution'
          destination-repository-name: 'claude-plugins'
          target-branch: main
          commit-message: "Sync from mill ${{ github.ref_name }}"
